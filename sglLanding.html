<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGL Landing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./sglLanding.css">
</head>

<body>
    <main>
        <img src="./ASSETS/LogoKiwiMintGreen.svg" alt="sgl-landing" class="main-logo">
        <section class="section-1">
                <h3>¡Haz realidad
                    tu tratamiento de salud hoy!</h3>
                <form action="" method="post" autocomplete="on" id="treatment-form">
                    <label for="recepcionista">Nombres y Apellidos Recepcionista</label>
                    <input type="text" id="recepcionista" name="recepcionista" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,}" title="Solo letras y espacios, mínimo 3 caracteres">

                    <label for="cliente">Nombres y Apellidos Cliente</label>
                    <input type="text" id="cliente" name="cliente" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,}" title="Solo letras y espacios, mínimo 3 caracteres">

                    <label for="clinica">Clínica <span style="color: rgb(155, 152, 152)">(obligatorio)</span></label>
                    <select id="clinica" name="clinica" required>
                        <option value="" disabled selected hidden>Cargando clínicas...</option>
                    </select>

                    <label for="especialidad">Especialidad Médica de Interés <span style="color: rgb(155, 152, 152)">(obligatorio)</span></label>
                    <select id="especialidad" name="especialidad" required>
                        <option value="" disabled selected hidden>Cargando especialidades...</option>
                    </select>

                    <label for="dni">N° DNI <span style="color: rgb(155, 152, 152)">(obligatorio)</span></label>
                    <input type="text" id="dni" name="dni" required pattern="\d{8}" maxlength="8" minlength="8" title="Debe tener 8 dígitos">

                    <label for="ingreso">Ingreso Mensual Promedio S/. <span style="color:rgb(155, 152, 152)">(obligatorio)</span></label>
                    <input type="number" id="ingreso" name="ingreso" required min="0" step="0.01" title="Ingrese un monto válido">

                    <label for="costo">Costo Apróx. Tratamiento S/. <span style="color: rgb(155, 152, 152)">(obligatorio)</span></label>
                    <input type="number" id="costo" name="costo" required min="0" step="0.01" title="Ingrese un monto válido">

                    <label for="telefono">Teléfono <span style="color: rgb(155, 152, 152)">(obligatorio)</span></label>
                    <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{9}" maxlength="9" minlength="9" title="Debe tener 9 dígitos">

                    <label for="correo">Correo electrónico (Opcional)</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" title="Ingrese un correo válido">

                    <button type="submit">Enviar</button>
                    <p id="form-message"></p>
                </form>
        </section>
        <section class="section-2">
            <div class="section-2-container">
                <div>
                    <img src="./ASSETS/logoWithKiwiGreen.svg" alt="sgl-landing-img" class="footer-logo">
                    <p>
                        Salud a tu alcance.
                    </p>
                </div>
                <div>
                    <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="#">Privacidad</a>
                    <a href="#">Libro de reclamaciones</a>
                    <p>© KIWI 2025</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Cargar configuración de variables de entorno -->
    <script src="./env-loader.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const form = document.getElementById('treatment-form');
            const messageEl = document.getElementById('form-message');

            // Usar configuración desde variables de entorno
            const config = window.config;

            // Cargar clínicas y especialidades al inicio
            await cargarClinicas();
            await cargarEspecialidades();

            async function cargarClinicas() {
                try {
                    console.log('🔍 Cargando clínicas desde:', config.CLINICS_ENDPOINT);
                    const response = await fetch(config.CLINICS_ENDPOINT);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    console.log('📋 Respuesta completa de clínicas:', data);
                    
                    // Manejar diferentes formatos de respuesta
                    let clinicas = [];
                    if (Array.isArray(data)) {
                        clinicas = data;
                    } else if (data.content && Array.isArray(data.content)) {
                        clinicas = data.content; // Respuesta paginada
                    } else if (data.data && Array.isArray(data.data)) {
                        clinicas = data.data; // Respuesta envuelta
                    } else if (data.clinics && Array.isArray(data.clinics)) {
                        clinicas = data.clinics;
                    } else {
                        console.error('❌ Formato de respuesta no reconocido para clínicas:', data);
                        throw new Error('Formato de respuesta de clínicas no válido');
                    }
                    
                    const selectClinica = document.getElementById('clinica');
                    // Limpiar y agregar placeholder
                    selectClinica.innerHTML = '<option value="" disabled selected hidden>Selecciona una clínica</option>';
                    
                    // Agregar clínicas activas
                    const clinicasActivas = clinicas.filter(clinica => clinica.active === true);
                    clinicasActivas.forEach(clinica => {
                        const option = new Option(clinica.name, clinica.id);
                        selectClinica.add(option);
                    });
                    
                    console.log(`✅ Cargadas ${clinicasActivas.length} clínicas de ${clinicas.length} totales`);
                } catch (error) {
                    console.error('❌ Error cargando clínicas:', error);
                    const selectClinica = document.getElementById('clinica');
                    selectClinica.innerHTML = '<option value="" disabled selected>Error cargando clínicas</option>';
                }
            }

            async function cargarEspecialidades() {
                try {
                    console.log('🔍 Cargando especialidades desde:', config.SPECIALTIES_ENDPOINT);
                    const response = await fetch(config.SPECIALTIES_ENDPOINT);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    console.log('📋 Respuesta completa de especialidades:', data);
                    
                    // Manejar diferentes formatos de respuesta
                    let especialidades = [];
                    if (Array.isArray(data)) {
                        especialidades = data;
                    } else if (data.content && Array.isArray(data.content)) {
                        especialidades = data.content; // Respuesta paginada
                    } else if (data.data && Array.isArray(data.data)) {
                        especialidades = data.data; // Respuesta envuelta
                    } else if (data.specialties && Array.isArray(data.specialties)) {
                        especialidades = data.specialties;
                    } else {
                        console.error('❌ Formato de respuesta no reconocido para especialidades:', data);
                        throw new Error('Formato de respuesta de especialidades no válido');
                    }
                    
                    const selectEspecialidad = document.getElementById('especialidad');
                    // Limpiar y agregar placeholder
                    selectEspecialidad.innerHTML = '<option value="" disabled selected hidden>Selecciona una especialidad</option>';
                    
                    // Agregar especialidades activas
                    const especialidadesActivas = especialidades.filter(especialidad => especialidad.active === true);
                    especialidadesActivas.forEach(especialidad => {
                        // Mostrar nombre y categoría para mejor comprensión
                        const textoOpcion = especialidad.category && especialidad.category !== especialidad.name 
                            ? `${especialidad.name} - ${especialidad.category}`
                            : especialidad.name;
                        
                        const option = new Option(textoOpcion, especialidad.id);
                        selectEspecialidad.add(option);
                    });
                    
                    console.log(`✅ Cargadas ${especialidadesActivas.length} especialidades de ${especialidades.length} totales`);
                } catch (error) {
                    console.error('❌ Error cargando especialidades:', error);
                    const selectEspecialidad = document.getElementById('especialidad');
                    selectEspecialidad.innerHTML = '<option value="" disabled selected>Error cargando especialidades</option>';
                }
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault(); 

                // Obtener valores sin procesar para debugging
                const valoresCrudos = {
                    recepcionista: document.getElementById('recepcionista').value,
                    cliente: document.getElementById('cliente').value,
                    clinica: document.getElementById('clinica').value,
                    especialidad: document.getElementById('especialidad').value,
                    dni: document.getElementById('dni').value,
                    ingreso: document.getElementById('ingreso').value,
                    costo: document.getElementById('costo').value,
                    telefono: document.getElementById('telefono').value,
                    correo: document.getElementById('correo').value,
                };

                console.log('🔍 Valores crudos del formulario:', valoresCrudos);

                // Validar que los campos requeridos no estén vacíos
                if (!valoresCrudos.recepcionista || valoresCrudos.recepcionista.trim().length < 3) {
                    messageEl.textContent = 'El nombre del recepcionista debe tener al menos 3 caracteres';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                if (!valoresCrudos.cliente || valoresCrudos.cliente.trim().length < 3) {
                    messageEl.textContent = 'El nombre del cliente debe tener al menos 3 caracteres';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                if (!valoresCrudos.clinica || valoresCrudos.clinica === '') {
                    messageEl.textContent = 'Debe seleccionar una clínica';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                if (!valoresCrudos.especialidad || valoresCrudos.especialidad === '') {
                    messageEl.textContent = 'Debe seleccionar una especialidad';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                // Validar montos mínimos
                const ingreso = parseFloat(valoresCrudos.ingreso);
                const costo = parseFloat(valoresCrudos.costo);

                if (isNaN(ingreso) || ingreso <= 0) {
                    messageEl.textContent = 'El ingreso mensual debe ser mayor a 0';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                if (isNaN(costo) || costo <= 0) {
                    messageEl.textContent = 'El costo del tratamiento debe ser mayor a 0';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                if (ingreso < 100) {
                    messageEl.textContent = 'El ingreso mensual parece muy bajo. ¿Está seguro?';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                if (costo < 50) {
                    messageEl.textContent = 'El costo del tratamiento parece muy bajo. ¿Está seguro?';
                    messageEl.style.color = config.COLORS.ERROR;
                    return;
                }

                // Validar DNI único (sugerir uno diferente si es de prueba)
                if (valoresCrudos.dni === '12345678') {
                    const randomDni = Math.floor(10000000 + Math.random() * 90000000).toString();
                    console.log(`💡 Sugerencia: El DNI ${valoresCrudos.dni} podría estar duplicado. Prueba con: ${randomDni}`);
                }

                // Preparar datos para envío
                const formData = {
                    receptionistName: valoresCrudos.recepcionista.trim(),
                    clientName: valoresCrudos.cliente.trim(),
                    clinicId: parseInt(valoresCrudos.clinica),
                    medicalSpecialtyId: parseInt(valoresCrudos.especialidad),
                    dni: valoresCrudos.dni.trim(),
                    monthlyIncome: parseFloat(valoresCrudos.ingreso),
                    treatmentCost: parseFloat(valoresCrudos.costo),
                    phone: valoresCrudos.telefono.trim(),
                    email: valoresCrudos.correo.trim() || null
                };

                console.log('📤 Datos finales a enviar:', formData);
                console.log('📤 Datos finales como JSON string:', JSON.stringify(formData, null, 2));

                // Usar endpoint desde configuración
                const apiEndpoint = config.API_ENDPOINT;
                console.log('🎯 Enviando a endpoint:', apiEndpoint);

                try {
                    messageEl.textContent = config.MESSAGES.SENDING;
                    messageEl.style.color = config.COLORS.DEFAULT;

                    const response = await fetch(apiEndpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData),
                    });

                    console.log('📊 Status de respuesta:', response.status);
                    console.log('📊 Headers de respuesta:', response.headers);

                    if (response.ok) {
                        const responseData = await response.json();
                        console.log('✅ Respuesta exitosa:', responseData);
                        
                        messageEl.textContent = config.MESSAGES.SUCCESS;
                        messageEl.style.color = config.COLORS.SUCCESS;
                        form.reset();
                        // Recargar las opciones después del reset
                        await cargarClinicas();
                        await cargarEspecialidades();
                    } else {
                        const errorData = await response.text();
                        console.error('❌ Error completo de la API:', errorData);
                        
                        // Intentar parsear como JSON para mejor información
                        try {
                            const errorJson = JSON.parse(errorData);
                            console.error('❌ Error parseado:', errorJson);
                            
                            if (errorJson.details) {
                                console.error('❌ Detalles de validación:', errorJson.details);
                            }

                            // Detectar errores específicos
                            if (errorJson.message && errorJson.message.includes('duplicate') || 
                                errorJson.message && errorJson.message.includes('duplicado') ||
                                errorJson.message && errorJson.message.includes('ya existe')) {
                                messageEl.textContent = 'El DNI ya está registrado. Pruebe con otro número.';
                                messageEl.style.color = config.COLORS.ERROR;
                                return;
                            }

                            if (errorJson.message && errorJson.message.includes('validation') ||
                                errorJson.message && errorJson.message.includes('validación')) {
                                messageEl.textContent = 'Error de validación en los datos. Revise los campos.';
                                messageEl.style.color = config.COLORS.ERROR;
                                return;
                            }
                            
                        } catch (e) {
                            console.error('❌ Error no es JSON válido');
                        }
                        
                        throw new Error(`${config.MESSAGES.ERROR_DETAIL} ${response.status} - ${errorData}`);
                    }
                } catch (error) {
                    console.error('❌ Error al enviar el formulario:', error);
                    messageEl.textContent = config.MESSAGES.ERROR;
                    messageEl.style.color = config.COLORS.ERROR;
                } finally {
                    setTimeout(() => {
                        messageEl.textContent = '';
                    }, config.MESSAGE_TIMEOUT);
                }
            });
        });
    </script>
</body>

</html>
