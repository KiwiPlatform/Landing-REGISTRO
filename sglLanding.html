<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGL Landing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./sglLanding.css">
</head>

<body>
    <main>
        <img src="./ASSETS/LogoKiwiMintGreen.svg" alt="sgl-landing" class="main-logo">
        <section class="section-1">
                <h3>¡Haz realidad
                    tu tratamiento de salud hoy!</h3>
                <form action="" method="post" autocomplete="on" id="treatment-form">
                    <label for="recepcionista">Nombres y Apellidos Recepcionista</label>
                    <input type="text" id="recepcionista" name="recepcionista" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,}" title="Solo letras y espacios, mínimo 3 caracteres">

                    <label for="cliente">Nombres y Apellidos Cliente</label>
                    <input type="text" id="cliente" name="cliente" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,}" title="Solo letras y espacios, mínimo 3 caracteres">

                    <label for="clinica">Clínica <span style="color:red">*</span></label>
                    <select id="clinica" name="clinica" required>
                        <option value="" disabled selected hidden>Selecciona una opcion</option>
                        <option value="clinica_a">Clínica A</option>
                        <option value="clinica_b">Clínica B</option>
                        <option value="clinica_c">Clínica C</option>
                        <option value="clinica_d">Clínica D</option>
                        <option value="clinica_e">Clínica E</option>
                    </select>

                    <label for="especialidad">Especialidad Médica de Interés <span style="color:red">*</span></label>
                    <select id="especialidad" name="especialidad" required>
                        <option value="" disabled selected hidden>Selecciona una opcion</option>
                        <option value="cardiologia">Cardiología</option>
                        <option value="dermatologia">Dermatología</option>
                        <option value="odontologia">Odontología</option>
                        <option value="ginecologia">Ginecología</option>
                        <option value="traumatologia">Traumatología</option>
                    </select>

                    <label for="dni">N° DNI <span style="color:red">*</span></label>
                    <input type="text" id="dni" name="dni" required pattern="\d{8}" maxlength="8" minlength="8" title="Debe tener 8 dígitos">

                    <label for="ingreso">Ingreso Mensual Promedio S/. <span style="color:red">*</span></label>
                    <input type="number" id="ingreso" name="ingreso" required min="0" step="0.01" title="Ingrese un monto válido">

                    <label for="costo">Costo Apróx. Tratamiento S/. <span style="color:red">*</span></label>
                    <input type="number" id="costo" name="costo" required min="0" step="0.01" title="Ingrese un monto válido">

                    <label for="telefono">Teléfono <span style="color:red">*</span></label>
                    <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{9}" maxlength="9" minlength="9" title="Debe tener 9 dígitos">

                    <label for="correo">Correo electrónico (Opcional)</label>
                    <input type="email" id="correo" name="correo" autocomplete="email" title="Ingrese un correo válido">

                    <button type="submit">Enviar</button>
                    <p id="form-message"></p>
                </form>
        </section>
        <section class="section-2">
            <div class="section-2-container">
                <div>
                    <img src="./ASSETS/logoWithKiwiGreen.svg" alt="sgl-landing-img" class="footer-logo">
                    <p>
                        Salud a tu alcance.
                    </p>
                </div>
                <div>
                    <a href="#" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
                    <a href="#">Privacidad</a>
                    <a href="#">Libro de reclamaciones</a>
                    <p>© KIWI 2025</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('treatment-form');
            const messageEl = document.getElementById('form-message');

            form.addEventListener('submit', async function (event) {
                event.preventDefault(); 

                const formData = {
                    recepcionista: document.getElementById('recepcionista').value,
                    cliente: document.getElementById('cliente').value,
                    clinica: document.getElementById('clinica').value,
                    especialidad: document.getElementById('especialidad').value,
                    dni: document.getElementById('dni').value,
                    ingreso: document.getElementById('ingreso').value,
                    costo: document.getElementById('costo').value,
                    telefono: document.getElementById('telefono').value,
                    correo: document.getElementById('correo').value,
                };

                const apiEndpoint = 'https://api.example.com/lead'; // <-- ¡IMPORTANTE! Cambia esta URL por la de tu API

                try {
                    messageEl.textContent = 'Enviando...';
                    messageEl.style.color = '#fff';

                    const response = await fetch(apiEndpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData),
                    });

                    if (response.ok) {
                        messageEl.textContent = '¡Datos enviados con éxito!';
                        messageEl.style.color = '#a5d6a7';
                        form.reset();
                    } else {
                        throw new Error(`Error en la solicitud: ${response.statusText}`);
                    }
                } catch (error) {
                    console.error('Error al enviar el formulario:', error);
                    messageEl.textContent = 'Error al enviar. Inténtalo de nuevo.';
                    messageEl.style.color = '#ff8a80';
                } finally {
                    setTimeout(() => {
                        messageEl.textContent = '';
                    }, 5000);
                }
            });
        });
    </script>
</body>

</html>
